<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Testes · Nível</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* Estilos só desta página (testes/ não entra no app nem no precache). */
    :root {
      --cor-passou: #4CC38A;
      --cor-falhou: #FF5C5C;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px var(--gutter) 48px;
    }
    .total {
      margin: 12px 0 20px;
      padding: 12px 16px;
      border-radius: var(--raio);
      background: var(--cor-cartao);
      border: 1px solid var(--cor-borda);
      font-family: var(--fonte-titulo);
      font-size: 1.5rem;
      font-weight: 700;
    }
    .total.passou { border-color: var(--cor-passou); color: var(--cor-passou); }
    .total.falhou { border-color: var(--cor-falhou); color: var(--cor-falhou); }
    .arquivo {
      margin: 24px 0 8px;
      color: var(--cor-texto-2);
      font-family: var(--fonte-texto);
      font-size: 0.875rem;
      font-weight: 700;
    }
    .teste {
      display: flex;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--cor-borda);
    }
    .marca {
      flex: none;
      width: 1.25em;
      font-weight: 700;
    }
    .teste.passou .marca { color: var(--cor-passou); }
    .teste.falhou .marca { color: var(--cor-falhou); }
    .teste.falhou .nome { color: var(--cor-falhou); }
    .erro {
      display: block;
      color: var(--cor-texto-2);
      font-size: 0.875rem;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Testes</h1>
    <p class="total" id="total">Rodando…</p>
    <div id="lista"></div>
  </main>

  <script type="module">
    import { h } from '../js/ui/dom.js';
    import { rodar } from './mini-teste.js';

    // Arquivos de teste. As próximas etapas acrescentam os seus aqui.
    const ARQUIVOS = ['./tipos.test.js', './dados.test.js', './busca.test.js', './sw.test.js', './db.test.js'];

    const lista = document.getElementById('lista');
    const total = document.getElementById('total');
    let passaram = 0;
    let quantos = 0;

    function linha(r) {
      return h('div', { class: `teste ${r.passou ? 'passou' : 'falhou'}` },
        h('span', { class: 'marca', 'aria-hidden': 'true' }, r.passou ? '✓' : '✗'),
        h('span', { class: 'nome' }, r.nome, r.erro ? h('span', { class: 'erro' }, r.erro) : null),
      );
    }

    // Cada arquivo é importado e rodado separado, para os resultados ficarem agrupados
    // e um arquivo que não carrega aparecer em vermelho em vez de travar a página.
    for (const arquivo of ARQUIVOS) {
      lista.append(h('h2', { class: 'arquivo' }, arquivo.replace('./', '')));
      let resultados;
      try {
        await import(arquivo);
        resultados = await rodar();
      } catch (erro) {
        resultados = [{ nome: `carregar ${arquivo}`, passou: false, erro: String(erro && erro.message || erro) }];
      }
      for (const r of resultados) {
        quantos++;
        if (r.passou) passaram++;
        lista.append(linha(r));
      }
    }

    const tudoVerde = quantos > 0 && passaram === quantos;
    total.textContent = `${passaram} de ${quantos} passaram`;
    total.className = `total ${tudoVerde ? 'passou' : 'falhou'}`;
    document.title = `${tudoVerde ? '✓' : '✗'} ${passaram}/${quantos} · Testes · Nível`;
  </script>
</body>
</html>
